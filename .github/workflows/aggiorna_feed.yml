name: Aggiorna Feed Sintesi

on:
  push:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Un solo giro alla volta: due esecuzioni contemporanee (es. cron + push) si
# contenderebbero feed_database.json e il secondo push fallirebbe.
concurrency:
  group: aggiorna-feed
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa dipendenze
        run: pip install requests feedparser beautifulsoup4 feedgen groq cloudscraper

      - name: Esegui pipeline Python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python pipeline_feedly.py

      - name: Salva modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A feed_sintesi.xml feed_contemporary_art_daily.xml feed_database.json articoli
          git diff --staged --quiet || (git commit -m "Feed aggiornato" && git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push)

      - name: Aggiorna cache CDN jsDelivr
        continue-on-error: true
        run: |
          for f in feed_sintesi.xml feed_contemporary_art_daily.xml rassegna.opml; do
            curl -s "https://purge.jsdelivr.net/gh/lorenzoromani367/NewsFeed@main/$f" || true
          done
