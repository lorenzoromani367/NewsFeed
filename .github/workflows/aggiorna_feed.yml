name: Aggiorna Feed Sintesi

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Installa dipendenze
        run: pip install requests feedparser beautifulsoup4 feedgen groq

      - name: Esegui pipeline Python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline_feedly.py

      - name: Salva modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_sintesi.xml feed_database.json
          git diff --staged --quiet || (git commit -m "Feed aggiornato" && git push)
