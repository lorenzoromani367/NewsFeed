name: Aggiorna Feed Sintesi

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Esegui la pipeline con Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline_feedly.py

      - name: Salva aggiornamenti nel repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_database.json feed_sintesi.xml
          git diff --staged --quiet || (git commit -m "Feed aggiornato [skip ci]" && git push)
